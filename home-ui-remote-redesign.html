<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NOYA · 遥控器优先首页概念</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
:root{--ink:#101210;--paper:#f3f0e9;--muted:#9e9d96;--line:rgba(244,241,232,.13);--glass:rgba(27,30,27,.72);--accent:#d8a780;--focus:#f4dfb8;--pad:clamp(34px,5vw,96px);--top-h:clamp(102px,12vh,132px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:'Noto Sans SC','DM Sans',sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 79% 12%,rgba(119,91,63,.17),transparent 33%),radial-gradient(ellipse at 8% 93%,rgba(68,78,66,.18),transparent 32%),linear-gradient(120deg,#141714,#101210 58%,#171816)}body:after{content:"";position:fixed;inset:0;opacity:.15;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E")}
.shell{position:relative;z-index:1;width:100%;height:100%;padding:0 var(--pad);display:flex;flex-direction:column}.top{height:var(--top-h);flex:none;margin:0 calc(var(--pad)*-1);padding:0 var(--pad);background:linear-gradient(180deg,rgba(32,35,32,.92),rgba(22,24,22,.72));border-bottom:1px solid var(--line);backdrop-filter:blur(28px);transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .28s;z-index:8}.topline{height:57%;display:flex;align-items:center;gap:20px;border-bottom:1px solid rgba(255,255,255,.07)}.brand{font-size:21px;font-weight:800;letter-spacing:.28em;margin-right:12px}.source{font-size:13px;color:#d9c9b8;letter-spacing:.05em}.source b{color:#d8a780;font-weight:500}.spacer{flex:1}.quick{display:flex;gap:4px}.control,.navitem,.action,.poster,.source,.brand{outline:none;cursor:pointer}.control{border:1px solid transparent;border-radius:99px;color:#ddd9cf;padding:9px 15px;font-size:13px;background:transparent;transition:.2s}.control:hover,.control.active{background:rgba(255,255,255,.07);color:#fff}.control.pick{border-color:rgba(216,167,128,.45);color:#e4ba99}.clock{font-size:12px;letter-spacing:.08em;color:#a9a89f;margin-left:18px}.navline{height:43%;display:flex;align-items:center;gap:clamp(22px,3.05vw,58px);overflow:hidden}.navitem{font-size:16px;color:#aaa9a2;white-space:nowrap;position:relative;padding:9px 0;transition:.2s}.navitem.selected{color:var(--paper)}.navitem.selected:after{content:"";height:2px;position:absolute;bottom:0;left:0;right:0;background:var(--accent)}
.main{flex:1;min-height:0;display:flex;flex-direction:column;transition:padding .38s}.hero{flex:1;min-height:240px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7vw;position:relative;transition:flex .38s,min-height .38s,padding .38s}.hero:before{content:"";position:absolute;left:-10vw;right:34%;top:8%;bottom:6%;background:radial-gradient(ellipse,rgba(212,190,157,.08),transparent 70%);filter:blur(22px);pointer-events:none}.hero-copy{max-width:800px;position:relative}.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:12px}.eyebrow:before{content:"";width:24px;height:1px;background:var(--accent)}h1{font-size:clamp(38px,5.2vw,82px);line-height:1.13;letter-spacing:-.035em;margin:20px 0 14px;font-weight:700}.meta{font-size:14px;color:#b3b0a7;letter-spacing:.03em}.desc{font-size:14px;color:#aaa89f;line-height:1.85;max-width:630px;margin:20px 0 25px}.hero-actions{display:flex;gap:12px;align-items:center}.action{height:46px;padding:0 22px;border-radius:8px;display:inline-flex;align-items:center;gap:10px;font-size:14px;border:1px solid rgba(243,240,233,.2);background:rgba(255,255,255,.035);color:var(--paper);transition:.2s}.action.primary{background:var(--paper);color:#171815;border-color:var(--paper);font-weight:700}.action .play{font-size:12px}.hero-art{width:clamp(185px,20vw,300px);height:clamp(245px,34vh,370px);border-radius:9px;position:relative;overflow:hidden;box-shadow:0 24px 70px #0009;transform:rotate(1deg);transition:height .38s,width .38s,transform .38s}.hero-art img{width:100%;height:100%;object-fit:cover;filter:saturate(.72)}.hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(12,13,12,.7))}.art-caption{position:absolute;bottom:17px;left:18px;z-index:2;font-size:12px;color:#eee5d8;letter-spacing:.14em}
.shelf{height:clamp(230px,29vh,320px);flex:none;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:clamp(25px,4vh,48px);transition:height .38s,padding .38s}.shelf-head{display:flex;align-items:end;margin-bottom:16px}.shelf-title{font-size:19px;font-weight:600;letter-spacing:.02em}.shelf-sub{font-size:12px;color:#888980;margin-left:14px}.shelf-more{margin-left:auto;color:#a7a49a;font-size:12px}.cards{display:flex;gap:14px;overflow:visible;align-items:stretch}.poster{height:clamp(130px,17vh,184px);width:clamp(205px,20vw,310px);flex:none;position:relative;overflow:hidden;border-radius:8px;background:#252722;transition:height .38s,width .38s,transform .22s,box-shadow .22s;box-shadow:0 8px 25px #0004}.poster img{height:100%;width:100%;object-fit:cover;filter:saturate(.76) brightness(.83);transition:filter .2s,transform .35s}.poster:after{content:"";position:absolute;inset:30% 0 0;background:linear-gradient(transparent,rgba(10,11,10,.9))}.poster-title{position:absolute;z-index:2;left:15px;bottom:13px;font-size:14px;font-weight:600;text-shadow:0 2px 10px #000}.poster-tag{position:absolute;z-index:2;left:14px;top:13px;color:#f1e8da;font-size:10px;padding:5px 8px;border-radius:4px;background:rgba(13,14,13,.52);backdrop-filter:blur(10px)}.poster.focused{transform:scale(1.055) translateY(-7px);box-shadow:0 0 0 3px var(--focus),0 15px 45px #0009;z-index:3}.poster.focused img{filter:saturate(.95) brightness(1)}
.footer{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;color:#777970;font-size:10px;letter-spacing:.04em}.keyhint{display:flex;gap:17px}.key{display:inline-grid;place-items:center;min-width:18px;height:18px;border:1px solid #5b5d55;border-radius:4px;color:#c2c0b6;font-size:10px;margin-right:5px;padding:0 4px}
.immersive .top{transform:translateY(-105%);opacity:0;pointer-events:none}.immersive .main{padding-top:0}.immersive .hero{flex:.78;min-height:190px}.immersive .hero-art{height:clamp(210px,27vh,300px);width:clamp(160px,17vw,250px)}.immersive .shelf{height:clamp(300px,40vh,440px);padding-bottom:clamp(22px,4vh,40px)}.immersive .poster{height:clamp(190px,27vh,292px);width:clamp(245px,23vw,355px)}
:focus-visible{outline:none}.focused:not(.poster){box-shadow:0 0 0 2px var(--focus),0 0 24px rgba(244,223,184,.17)!important;background-color:rgba(255,255,255,.11)!important;color:#fff!important;transform:scale(1.035)}
.toast{position:fixed;z-index:20;left:50%;bottom:30px;transform:translate(-50%,20px);padding:11px 18px;border:1px solid #ffffff27;border-radius:99px;color:#eee9df;background:#242621dc;backdrop-filter:blur(18px);opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.demo{position:fixed;z-index:15;right:24px;bottom:24px;color:#aaa99f;font-size:10px;letter-spacing:.1em;opacity:.68}.demo button{border:1px solid #ffffff26;border-radius:99px;background:#ffffff0a;color:#d7d1c5;padding:7px 12px;cursor:pointer}
@media(max-width:1050px){:root{--pad:34px}.quick .optional,.clock{display:none}.navline{gap:22px}.desc{max-width:480px}.hero{gap:4vw}.poster{width:23vw}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="top" id="top">
    <div class="topline">
      <div class="brand focusable" tabindex="0" data-row="top">NOYA</div>
      <div class="source focusable" tabindex="0" data-row="top">✿ 茉莉 <b>｜ 多线</b></div>
      <button class="control focusable" tabindex="0" data-row="top">⟳ 换源</button>
      <button class="control pick focusable" tabindex="0" data-row="top">✦ 随机看</button>
      <div class="spacer"></div>
      <div class="quick">
        <button class="control focusable" tabindex="0" data-row="top">直播</button><button class="control focusable optional" tabindex="0" data-row="top">历史</button><button class="control focusable optional" tabindex="0" data-row="top">收藏</button><button class="control focusable optional" tabindex="0" data-row="top">推送</button><button class="control focusable optional" tabindex="0" data-row="top">遥控</button><button class="control focusable" tabindex="0" data-row="top">搜索</button><button class="control focusable optional" tabindex="0" data-row="top">设置</button>
      </div><div class="clock">周六　22:18</div>
    </div>
    <nav class="navline" aria-label="频道">
      <div class="navitem selected focusable" tabindex="0" data-row="nav">首页</div><div class="navitem focusable" tabindex="0" data-row="nav">电影</div><div class="navitem focusable" tabindex="0" data-row="nav">剧集</div><div class="navitem focusable" tabindex="0" data-row="nav">动漫</div><div class="navitem focusable" tabindex="0" data-row="nav">综艺</div><div class="navitem focusable" tabindex="0" data-row="nav">短剧</div><div class="navitem focusable" tabindex="0" data-row="nav">纪录片</div><div class="navitem focusable" tabindex="0" data-row="nav">国产</div>
    </nav>
  </header>
  <main class="main">
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">接着看 <span style="opacity:.5">/</span> CONTINUE</div>
        <h1>潜龙无意惹红妆</h1>
        <div class="meta">糯米 · 上次看到 第 01 集　 ·　剩余 38 分钟</div>
        <p class="desc">一场意外相遇，牵出尘封多年的身世与旧案。今晚接着看，不用重新找进度。</p>
        <div class="hero-actions"><button class="action primary focusable" tabindex="0" data-row="content"><span class="play">▶</span> 继续播放 <span style="opacity:.58">第 02 集</span></button><button class="action focusable" tabindex="0" data-row="content">影片详情</button></div>
      </div>
      <div class="hero-art"><img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=85" alt="电影氛围图"><div class="art-caption">今晚接着看　·　01 / 24</div></div>
    </section>
    <section class="shelf" aria-label="推荐片单">
      <div class="shelf-head"><div class="shelf-title">接下来放什么</div><div class="shelf-sub">按你的片单挑选</div><div class="shelf-more">更多推荐　→</div></div>
      <div class="cards" id="cards">
        <article class="poster focused focusable" tabindex="0" data-row="cards"><img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=700&q=85" alt=""><span class="poster-tag">新番更新</span><span class="poster-title">雾山五行 · 第二季</span></article>
        <article class="poster focusable" tabindex="0" data-row="cards"><img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=700&q=85" alt=""><span class="poster-tag">口碑热播</span><span class="poster-title">长夜星河</span></article>
        <article class="poster focusable" tabindex="0" data-row="cards"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=700&q=85" alt=""><span class="poster-tag">正在热映</span><span class="poster-title">山海之间</span></article>
        <article class="poster focusable" tabindex="0" data-row="cards"><img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=700&q=85" alt=""><span class="poster-tag">高分电影</span><span class="poster-title">月球来信</span></article>
        <article class="poster focusable" tabindex="0" data-row="cards"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=85" alt=""><span class="poster-tag">央视精选</span><span class="poster-title">大地的回响</span></article>
      </div>
    </section>
  </main>
  <footer class="footer"><span>NOYA · 让今晚的选择简单一点</span><div class="keyhint"><span><i class="key">↑</i>导航</span><span><i class="key">↓</i>沉浸观看</span><span><i class="key">OK</i>选择</span><span><i class="key">← →</i>切换</span></div></footer>
</div>
<div class="toast" id="toast">已打开影片详情</div><div class="demo">遥控器交互演示　<button id="toggle">进入沉浸</button></div>
<script>
const shell=document.getElementById('shell'),topbar=document.getElementById('top'),toast=document.getElementById('toast');
const navItems=[...document.querySelectorAll('[data-row="nav"]')],cards=[...document.querySelectorAll('.poster')],content=[...document.querySelectorAll('[data-row="content"]')];
let navIndex=0, cardIndex=0, toastTimer;
function setFocus(el){if(!el)return;document.querySelectorAll('.focused').forEach(x=>x.classList.remove('focused'));el.classList.add('focused');el.focus({preventScroll:true})}
function enterImmersive(){if(shell.classList.contains('immersive'))return;shell.classList.add('immersive');document.getElementById('toggle').textContent='恢复导航';setFocus(content[0])}
function revealNav(){if(!shell.classList.contains('immersive'))return;shell.classList.remove('immersive');document.getElementById('toggle').textContent='进入沉浸';setFocus(navItems[navIndex])}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)}
document.addEventListener('keydown',e=>{let k=e.key,active=document.activeElement;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(k))e.preventDefault();
 if(k==='ArrowDown'){if(!shell.classList.contains('immersive'))enterImmersive();else if(content.includes(active)){cardIndex=0;setFocus(cards[cardIndex])}else if(active.classList.contains('poster'))showToast('已在推荐片单中');return}
 if(k==='ArrowUp'){if(shell.classList.contains('immersive')){revealNav();return}if(active.dataset.row==='cards'){setFocus(content[0]);return}if(active.dataset.row==='content'){navIndex=Math.max(0,navIndex);revealNav();return}}
 if(k==='ArrowLeft'||k==='ArrowRight'){let d=k==='ArrowRight'?1:-1;if(active.dataset.row==='nav'){navIndex=(navIndex+d+navItems.length)%navItems.length;navItems.forEach((n,i)=>n.classList.toggle('selected',i===navIndex));setFocus(navItems[navIndex])}else if(active.dataset.row==='cards'){cardIndex=Math.max(0,Math.min(cards.length-1,cardIndex+d));setFocus(cards[cardIndex]);cards[cardIndex].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}else{let group=[...document.querySelectorAll('.topline .focusable')],i=group.indexOf(active);if(i>=0)setFocus(group[Math.max(0,Math.min(group.length-1,i+d))])}return}
 if(k==='Enter'||k===' '){if(active.classList.contains('poster'))showToast('已选择：'+active.querySelector('.poster-title').textContent+'　·　打开详情');else if(active.classList.contains('action'))showToast(active.textContent.includes('继续')?'正在继续播放':'已打开影片详情');else if(active.dataset.row==='nav'){navIndex=navItems.indexOf(active);navItems.forEach((n,i)=>n.classList.toggle('selected',i===navIndex));showToast('切换到 '+active.textContent)}else showToast(active.textContent.trim()+' 已打开')}
});
document.getElementById('toggle').addEventListener('click',()=>shell.classList.contains('immersive')?revealNav():enterImmersive());
document.querySelectorAll('.focusable').forEach(el=>el.addEventListener('focus',()=>{document.querySelectorAll('.focused').forEach(x=>x.classList.remove('focused'));el.classList.add('focused')}));
setFocus(navItems[0]);
</script>
</body>
</html>
