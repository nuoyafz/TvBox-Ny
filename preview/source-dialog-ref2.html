<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
<meta charset="UTF-8">
<title>数据源 · 成熟设计第二组</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;font-family:"Microsoft YaHei",sans-serif;color:#fff;padding:26px 0 60px}
  .stage{width:1080px;margin:0 auto}
  h1{font-size:20px;color:#888;font-weight:normal;letter-spacing:.15em;margin:0 0 4px 6px}
  .sub{font-size:13px;color:#555;margin:0 0 26px 6px}
  .tv{width:100%;height:430px;border-radius:14px;overflow:hidden;position:relative;margin-bottom:16px;border:1px solid #222}

  /* ===== Apple TV 用户切换：近黑场 + 大圆 + 细白环 ===== */
  .atv{background:radial-gradient(ellipse at 50% 120%,#1c1c1e,#000 70%);height:100%;
       display:flex;flex-direction:column;align-items:center;padding-top:44px}
  .atv h2{font-size:17px;font-weight:400;color:#98989d;letter-spacing:.05em;margin-bottom:40px}
  .atv .row{display:flex;gap:44px}
  .atv .u{display:flex;flex-direction:column;align-items:center;gap:14px}
  .atv .ava{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            font-size:30px;font-weight:600;color:#fff;border:4px solid transparent}
  .atv .u.sel .ava{border-color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.15),0 12px 30px rgba(0,0,0,.6)}
  .atv .u p{font-size:14px;color:#8e8e93}
  .atv .u.sel p{color:#fff;font-size:15px}
  .a1{background:linear-gradient(145deg,#e5935c,#9c4a1d)}
  .a2{background:linear-gradient(145deg,#5ca8e5,#1d5b9c)}
  .a3{background:linear-gradient(145deg,#7ee55c,#2d7a1d)}
  .a4{background:linear-gradient(145deg,#e55cb1,#7a1d5b)}
  .a5{background:linear-gradient(145deg,#e5dd5c,#7a731d)}

  /* ===== Xbox 大磁贴： LIVE 色块墙，绿点缀 ===== */
  .xb{background:linear-gradient(160deg,#0e2a12 0%,#071018 55%,#020507 100%);height:100%;padding:30px 34px}
  .xb h2{font-size:15px;font-weight:600;letter-spacing:.24em;color:#9bf00b;margin-bottom:22px}
  .xb .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,146px);gap:16px}
  .xb .g{border-radius:6px;padding:18px 20px;position:relative;overflow:hidden;background:#12211a;
         border:1px solid rgba(155,240,11,.0)}
  .xb .g .big{font-size:26px;font-weight:700;letter-spacing:.02em}
  .xb .g .meta{position:absolute;left:20px;bottom:16px;font-size:12px;color:rgba(255,255,255,.55)}
  .xb .g .tint{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;filter:blur(2px);opacity:.85}
  .xb .g.sel{border:3px solid #9bf00b;background:#16281c}
  .xb .g.sel::after{content:'▶ 当前';position:absolute;right:18px;top:18px;font-size:11px;color:#9bf00b;letter-spacing:.2em}

  /* ===== Plex 横幅卡：左色带 + 大字横条 ===== */
  .px{background:#1a1a1a;height:100%;padding:30px 0}
  .px h2{font-size:15px;font-weight:600;letter-spacing:.24em;color:#e5a00d;margin:0 40px 22px}
  .px .list{display:flex;flex-direction:column;gap:10px;padding:0 40px}
  .px .b{display:flex;align-items:center;height:64px;border-radius:4px;background:#242424;overflow:hidden;position:relative}
  .px .b .bar{width:6px;height:100%;flex:0 0 auto}
  .px .b .nm{font-size:17px;font-weight:600;margin-left:20px;letter-spacing:.02em}
  .px .b .meta{margin-left:auto;margin-right:20px;font-size:11px;letter-spacing:.2em;color:#8a8a8a}
  .px .b.sel{background:#e5a00d}
  .px .b.sel .nm,.px .b.sel .meta{color:#141414}
  .px .b.sel .meta{font-weight:bold}
</style>
</head>
<body>
<div class="stage">
  <h1>成熟设计第二组 · 三个方案</h1>
  <div class="sub">Apple TV · Xbox · Plex，三种完全不同气质</div>

  <!-- Apple TV -->
  <div class="tv">
    <div class="atv">
      <h2>选择数据源</h2>
      <div class="row">
        <div class="u sel"><div class="ava a1">文</div><p>文采 · 秒播</p></div>
        <div class="u"><div class="ava a2">豆</div><p>豆豆片单</p></div>
        <div class="u"><div class="ava a3">云</div><p>我的云盘</p></div>
        <div class="u"><div class="ava a4">偶</div><p>玩偶哥哥</p></div>
        <div class="u"><div class="ava a5">荐</div><p>荐影</p></div>
      </div>
    </div>
  </div>

  <!-- Xbox -->
  <div class="tv">
    <div class="xb">
      <h2>SOURCE LIBRARY</h2>
      <div class="grid">
        <div class="g sel"><div class="tint" style="background:#e50914"></div><div class="big">文采</div><div class="meta">秒播 · 当前使用</div></div>
        <div class="g"><div class="tint" style="background:#1f6feb"></div><div class="big">玩偶哥哥</div><div class="meta">4K 弹幕</div></div>
        <div class="g"><div class="tint" style="background:#2ea043"></div><div class="big">我的云盘</div><div class="meta">配置</div></div>
        <div class="g"><div class="tint" style="background:#a371f7"></div><div class="big">豆豆片单</div><div class="meta">修复漫画</div></div>
        <div class="g"><div class="tint" style="background:#f0883e"></div><div class="big">荐影</div><div class="meta">预告片</div></div>
        <div class="g"><div class="tint" style="background:#29b3a6"></div><div class="big">易听</div><div class="meta">音乐</div></div>
      </div>
    </div>
  </div>

  <!-- Plex -->
  <div class="tv">
    <div class="px">
      <h2>SELECT SOURCE</h2>
      <div class="list">
        <div class="b sel"><div class="bar" style="background:#e50914"></div><div class="nm">文采 · 秒播</div><div class="meta">当前使用</div></div>
        <div class="b"><div class="bar" style="background:#1f6feb"></div><div class="nm">玩偶哥哥 · 4K弹幕</div><div class="meta">4K</div></div>
        <div class="b"><div class="bar" style="background:#2ea043"></div><div class="nm">我的云盘 · 配置</div><div class="meta">CLOUD</div></div>
        <div class="b"><div class="bar" style="background:#a371f7"></div><div class="nm">豆豆片单 · 修复漫画</div><div class="meta">MULTI</div></div>
        <div class="b"><div class="bar" style="background:#f0883e"></div><div class="nm">荐影 · 预告片</div><div class="meta">TRAILER</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
