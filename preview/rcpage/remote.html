	<style>
		/* 遥控面板 v3：单屏实体遥控 —— 导航环 + 摇杆/大返回并排，竖向不滚动 */
		.rc {
			height: 100%;
			max-width: 400px;
			margin: 0 auto;
			padding: 10px 14px 12px;
			display: flex;
			flex-direction: column;
			justify-content: space-evenly;
			align-items: center;
			text-align: center;
			box-sizing: border-box;
			background: linear-gradient(180deg, #232327 0%, #161619 45%, #0e0e11 100%);
			border-left: 1px solid #2c2c33;
			border-right: 1px solid #2c2c33;
			overflow: hidden;
		}

		.rc__head {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex: 0 0 auto;
		}

		.rc__title {
			font-size: 13px;
			font-weight: 700;
			letter-spacing: .28em;
			color: #DFA35C;
		}

		.rc__speed {
			flex: 1;
			margin-left: 12px;
			text-align: right;
			font-size: 11px;
			letter-spacing: .06em;
			color: #B5ADA1;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* 圆形导航环：↑◀OK▶▼ */
		.rc__grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			grid-template-rows: repeat(3, 1fr);
			width: 208px;
			height: 208px;
			flex: 0 0 auto;
			border-radius: 50%;
			border: 1px solid rgba(255, 255, 255, .18);
			background:
				radial-gradient(circle at 50% 50%, transparent 52%, rgba(255, 255, 255, .05) 53%, rgba(255, 255, 255, .10) 82%, transparent 83%),
				radial-gradient(circle at 50% 38%, #26262c, #141417 72%);
			box-shadow: inset 0 2px 10px rgba(0, 0, 0, .6), 0 1px 0 rgba(255, 255, 255, .06);
		}

		.rc__key {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 50%;
			background: transparent;
			color: #F2EDE5;
			font-size: 26px;
			font-weight: 600;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		.rc__key:active,
		.rc__key.is-on {
			background: rgba(223, 163, 92, .30);
			color: #FFD9A6;
			box-shadow: 0 0 18px rgba(223, 163, 92, .35) inset;
		}

		.rc__key--ok {
			width: 76px;
			height: 76px;
			justify-self: center;
			align-self: center;
			background: radial-gradient(circle at 50% 34%, #FFC372, #DFA35C 62%, #B97F3C 100%);
			color: #241505;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: .1em;
			box-shadow: 0 4px 16px rgba(223, 163, 92, .45), inset 0 1px 0 rgba(255, 255, 255, .5);
		}

		.rc__key--ok:active,
		.rc__key--ok.is-on {
			background: radial-gradient(circle at 50% 34%, #FFD9A6, #FFC372 62%, #DFA35C 100%);
			color: #241505;
		}

		/* 中段：摇杆 + 大返回 并排 */
		.rc__mid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 14px;
			width: 100%;
			justify-items: center;
			align-items: center;
			flex: 0 0 auto;
		}

		.rc__stick {
			position: relative;
			width: 104px;
			height: 104px;
			border-radius: 50%;
			border: 1px solid rgba(255, 255, 255, .16);
			background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
		}

		.rc__stick::after {
			content: '';
			position: absolute;
			left: 50%;
			top: 50%;
			width: 48px;
			height: 48px;
			margin: -24px 0 0 -24px;
			border-radius: 50%;
			border: 1px dashed rgba(255, 255, 255, .14);
			pointer-events: none;
		}

		.rc__ball {
			position: absolute;
			left: 50%;
			top: 50%;
			width: 44px;
			height: 44px;
			margin: -22px 0 0 -22px;
			border-radius: 50%;
			background: radial-gradient(circle at 50% 32%, #FFC372, #DFA35C 66%, #A96F33 100%);
			box-shadow: 0 3px 10px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .45);
			transition: transform .14s cubic-bezier(.22, .61, .36, 1);
			pointer-events: none;
		}

		.rc__stick.is-on .rc__ball {
			transition: none;
		}

		.rc__key--back {
			width: 104px;
			height: 104px;
			border-radius: 50%;
			background: linear-gradient(180deg, #2e2e34, #1d1d22);
			border: 2px solid #6b6b74;
			color: #F5F1EA;
			font-size: 26px;
			flex-direction: column;
			gap: 0;
			box-shadow: 0 3px 10px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .1);
		}

		.rc__key--back span {
			font-size: 13px;
			font-weight: 600;
			letter-spacing: .12em;
		}

		.rc__key--back:active,
		.rc__key--back.is-on {
			background: linear-gradient(180deg, #FFC372, #DFA35C);
			border-color: #FFC372;
			color: #241505;
		}

		.rc__label {
			font-size: 10px;
			letter-spacing: .24em;
			color: #8F887E;
			margin-top: 4px;
		}

		.rc__col {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
		}

		/* 功能键行：主页 / 菜单 / 播放 */
		.rc__row {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 10px;
			width: 100%;
			flex: 0 0 auto;
		}

		.rc__row .rc__key {
			height: 46px;
			border-radius: 23px;
			background: linear-gradient(180deg, #2e2e34, #1d1d22);
			border: 1px solid #46464f;
			color: #F5F1EA;
			font-size: 14px;
			font-weight: 600;
			box-shadow: 0 2px 6px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .09);
		}

		.rc__row .rc__key:active,
		.rc__row .rc__key.is-on {
			background: linear-gradient(180deg, #FFC372, #DFA35C);
			border-color: #FFC372;
			color: #241505;
		}

		.rc__mic {
			flex: 0 0 auto;
			margin-left: 8px;
			padding: 0 14px;
			height: 40px;
			border-radius: 6px;
			border: 1px solid rgba(250, 246, 240, .22);
			background: transparent;
			color: #FAF6F0;
			font-size: 15px;
		}

		.rc__mic.is-rec {
			color: #DFA35C;
			border-color: #DFA35C;
		}
	</style>
</head>
