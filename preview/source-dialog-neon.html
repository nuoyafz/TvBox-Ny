<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
<meta charset="UTF-8">
<title>NOYA 片仓 · 霓虹换源</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:"Microsoft YaHei",sans-serif;color:#fff;overflow-x:hidden}
  .tv{width:1080px;height:640px;margin:24px auto;position:relative;border-radius:12px;overflow:hidden;
      background:radial-gradient(ellipse at 50% 120%,#16120c 0%,#060504 60%,#010101 100%)}

  /* 放映机光束：从顶部打下来的锥形光 */
  .beam{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:900px;height:300px;
        background:linear-gradient(180deg,rgba(255,235,200,.16),transparent 75%);
        clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);filter:blur(6px);pointer-events:none}

  /* 胶片颗粒 */
  .grain{position:absolute;inset:0;opacity:.05;pointer-events:none;
    background-image:repeating-conic-gradient(#fff 0 .00003%,transparent 0 .0005%);
    animation:grain .35s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-14px,8px)}50%{transform:translate(10px,-12px)}75%{transform:translate(-6px,-8px)}100%{transform:translate(0,0)}}

  /* 暗角 */
  .vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}

  .head{position:absolute;top:26px;left:0;right:0;text-align:center;z-index:3}
  .head .en{font-family:Georgia,serif;font-size:11px;letter-spacing:.5em;color:#8a7a5f}
  .head .cn{font-size:20px;letter-spacing:.35em;color:#FAF6F0;margin-top:8px;text-indent:.35em}
  .head .tip{font-size:11px;color:#5c5347;margin-top:10px;letter-spacing:.15em}

  /* 霓虹招牌墙 */
  .wall{position:absolute;top:150px;left:80px;right:80px;display:grid;
        grid-template-columns:repeat(4,1fr);gap:22px;z-index:2}
  .sign{height:96px;border-radius:10px;position:relative;cursor:pointer;
        background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
        border:1px solid rgba(255,255,255,.07);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
        transition:transform .3s cubic-bezier(.22,.61,.36,1)}
  /* 熄灯的灯管轮廓 */
  .sign .nm{font-size:19px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.13);
            text-shadow:none;transition:.2s}
  .sign .cap{font-size:9px;letter-spacing:.3em;color:rgba(255,255,255,.10);transition:.2s}

  /* 点亮的霓虹：品牌色 + 三层光晕 + 玻璃反光 */
  .sign.on{transform:scale(1.07);
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    border:1px solid var(--c);animation:buzz 4s infinite}
  .sign.on .nm{color:#fff;text-shadow:0 0 4px #fff,0 0 12px var(--c),0 0 34px var(--c),0 0 70px var(--c)}
  .sign.on .cap{color:var(--c);text-shadow:0 0 8px var(--c)}
  .sign.on::before{content:'';position:absolute;inset:0;border-radius:10px;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.12),transparent 45%)}
  /* 地面灯池反射 */
  .sign.on::after{content:'';position:absolute;left:8%;right:8%;bottom:-16px;height:14px;border-radius:50%;
    background:var(--c);opacity:.35;filter:blur(10px)}
  /* 通电闪烁 */
  @keyframes buzz{
    0%,100%{filter:brightness(1)}
    3%{filter:brightness(.4)} 4%{filter:brightness(1.5)} 6%{filter:brightness(.6)}
    8%{filter:brightness(1.3)} 11%{filter:brightness(1)}
    83%{filter:brightness(1)} 84%{filter:brightness(.75)} 86%{filter:brightness(1)}
  }

  /* 底部遥控提示条 */
  .foot{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:12px 0;text-align:center;
        font-size:11px;letter-spacing:.2em;color:#5c5347;
        background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
  .foot b{color:#DFA35C;font-weight:normal}

  .s1{--c:#ff4d5e}.s2{--c:#4da3ff}.s3{--c:#4dff88}.s4{--c:#c04dff}
  .s5{--c:#ffb84d}.s6{--c:#4dfff0}.s7{--c:#ffe04d}.s8{--c:#ff4dd2}
</style>
</head>
<body>
<div class="tv">
  <div class="beam"></div>
  <div class="head">
    <div class="en">N O Y A &nbsp;·&nbsp; F I L M &nbsp; V A U L T</div>
    <div class="cn">换 一 块 牌 子</div>
    <div class="tip">当前亮着的就是正在使用的片源 · 确认即换台</div>
  </div>

  <div class="wall">
    <div class="sign s1 on"><div class="nm">文采</div><div class="cap">秒播</div></div>
    <div class="sign s2"><div class="nm">玩偶哥哥</div><div class="cap">4K 弹幕</div></div>
    <div class="sign s3"><div class="nm">我的云盘</div><div class="cap">配置</div></div>
    <div class="sign s4"><div class="nm">豆豆片单</div><div class="cap">修复漫画</div></div>
    <div class="sign s5"><div class="nm">荐影</div><div class="cap">预告片</div></div>
    <div class="sign s6"><div class="nm">易听</div><div class="cap">音乐</div></div>
    <div class="sign s7"><div class="nm">聚剧</div><div class="cap">四盘</div></div>
    <div class="sign s8"><div class="nm">光影</div><div class="cap">不卡</div></div>
  </div>

  <div class="foot">遥控 <b>上下左右</b> 挑牌子 · <b>OK</b> 通电换台 · 长按 <b>菜单</b> 回默认源</div>
  <div class="grain"></div>
  <div class="vig"></div>
</div>
</body>
</html>
