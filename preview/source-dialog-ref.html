<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
<meta charset="UTF-8">
<title>数据源 · 成熟设计直接套</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;font-family:"Microsoft YaHei",sans-serif;color:#fff;padding:26px 0 60px}
  .stage{width:1080px;margin:0 auto}
  h1{font-size:20px;color:#888;font-weight:normal;letter-spacing:.15em;margin:0 0 4px 6px}
  .sub{font-size:13px;color:#555;margin:0 0 26px 6px}
  .tv{width:100%;height:460px;border-radius:14px;overflow:hidden;position:relative;background:#000;margin-bottom:16px;border:1px solid #222}

  /* ===== Netflix 资料选择器风：黑场 + 大色块卡 + 顶部聚光标题 ===== */
  .nf{background:#141414;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:34px}
  .nf h2{font-size:26px;font-weight:600;letter-spacing:.04em;margin-bottom:34px}
  .nf .tiles{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;width:900px}
  .nf .tile{width:150px;text-align:center}
  .nf .face{height:150px;border-radius:8px;display:flex;align-items:center;justify-content:center;
            font-size:34px;font-weight:bold;letter-spacing:.06em;transition:.15s;position:relative;overflow:hidden}
  .nf .face::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.14),transparent 55%)}
  .nf .tile p{margin-top:12px;font-size:14px;color:#9a9a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nf .tile.sel .face{outline:4px solid #fff}
  .nf .tile.sel p{color:#fff}
  /* 每源一个品牌色块（Netflix 用头像色块区分人，这里用色相区分源） */
  .c1{background:linear-gradient(150deg,#e50914 0%,#7a0509 100%)}
  .c2{background:linear-gradient(150deg,#1f6feb 0%,#0a2f66 100%)}
  .c3{background:linear-gradient(150deg,#2ea043 0%,#0f3d1c 100%)}
  .c4{background:linear-gradient(150deg,#a371f7 0%,#3d1d6b 100%)}
  .c5{background:linear-gradient(150deg,#f0883e 0%,#6e3a12 100%)}
  .c6{background:linear-gradient(150deg,#29b3a6 0%,#0e4a44 100%)}
  .c7{background:linear-gradient(150deg,#e2b93b 0%,#5f4c0e 100%)}
  .c8{background:linear-gradient(150deg,#d65db1 0%,#521c40 100%)}
  .c9{background:linear-gradient(150deg,#5a6acf 0%,#23244d 100%)}

  /* ===== Disney+ 品牌磁贴风：深空蓝 + 16:9 玻璃磁贴 + 白色选中环 ===== */
  .dp{background:radial-gradient(ellipse at 50% -10%,#0d2a52 0%,#050b18 58%,#020409 100%);height:100%;
      display:flex;flex-direction:column;align-items:center;padding-top:36px}
  .dp h2{font-size:22px;font-weight:500;letter-spacing:.2em;margin-bottom:30px;color:#cfd8e6}
  .dp .tiles{display:grid;grid-template-columns:repeat(4,220px);gap:18px}
  .dp .tile{border-radius:10px;height:118px;position:relative;padding:16px 18px;
            background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
            border:2px solid transparent;box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .dp .tile .brand{font-size:20px;font-weight:bold;letter-spacing:.04em}
  .dp .tile .meta{position:absolute;left:18px;bottom:14px;font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.55)}
  .dp .tile .glow{position:absolute;right:-24px;top:-24px;width:110px;height:110px;border-radius:50%;opacity:.5;filter:blur(6px)}
  .dp .tile.sel{border-color:#fff}
  .dp .tile.sel .meta{color:#fff}
</style>
</head>
<body>
<div class="stage">
  <h1>成熟设计直接套 · 两个方案</h1>
  <div class="sub">都是电视端被验证过多年的交互范式，只换内容不换骨架</div>

  <!-- Netflix -->
  <div class="tv">
    <div class="nf">
      <h2>谁在看？→ 换成：选个数据源</h2>
      <div class="tiles">
        <div class="tile sel"><div class="face c1">文采</div><p>秒播 · 默认</p></div>
        <div class="tile"><div class="face c2">豆豆</div><p>修复漫画</p></div>
        <div class="tile"><div class="face c3">云盘</div><p>配置</p></div>
        <div class="tile"><div class="face c4">玩偶</div><p>4K 弹幕</p></div>
        <div class="tile"><div class="face c5">荐影</div><p>预告片</p></div>
        <div class="tile"><div class="face c6">易听</div><p>音乐</p></div>
        <div class="tile"><div class="face c7">聚剧</div><p>四盘</p></div>
        <div class="tile"><div class="face c8">光影</div><p>不卡</p></div>
        <div class="tile"><div class="face c9">比特</div><p>不卡</p></div>
      </div>
    </div>
  </div>

  <!-- Disney+ -->
  <div class="tv">
    <div class="dp">
      <h2>SELECT SOURCE</h2>
      <div class="tiles">
        <div class="tile sel"><div class="glow" style="background:#e50914"></div><div class="brand">文采</div><div class="meta">秒播 · 当前使用</div></div>
        <div class="tile"><div class="glow" style="background:#1f6feb"></div><div class="brand">玩偶哥哥</div><div class="meta">4K 弹幕</div></div>
        <div class="tile"><div class="glow" style="background:#2ea043"></div><div class="brand">我的云盘</div><div class="meta">配置</div></div>
        <div class="tile"><div class="glow" style="background:#a371f7"></div><div class="brand">豆豆片单</div><div class="meta">修复漫画</div></div>
        <div class="tile"><div class="glow" style="background:#f0883e"></div><div class="brand">荐影</div><div class="meta">预告片</div></div>
        <div class="tile"><div class="glow" style="background:#29b3a6"></div><div class="brand">易听</div><div class="meta">音乐</div></div>
        <div class="tile"><div class="glow" style="background:#e2b93b"></div><div class="brand">聚剧</div><div class="meta">四盘</div></div>
        <div class="tile"><div class="glow" style="background:#d65db1"></div><div class="brand">光影</div><div class="meta">不卡</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
