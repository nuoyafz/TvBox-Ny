<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0A09">
<title>手机接着看</title>
<style>
  :root{
    --ink:#0B0A09; --surface:#141210; --line:#241F1A;
    --text:#FAF6F0; --dim:#9A938A; --accent:#DFA35C;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}

  header{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)) 16px;
    border-bottom:1px solid var(--line);
  }
  header .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  header h1{font-size:15px;font-weight:600;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  header span{font-size:11px;color:var(--dim);letter-spacing:.14em;flex:0 0 auto}

  #stage{flex:1 1 auto;position:relative;background:#000;min-height:0}
  #stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}

  #state{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
    background:rgba(11,10,9,.92);
  }
  #state.hide{display:none}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:2px solid rgba(250,246,240,.18);border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #state p{font-size:13px;line-height:1.7;color:var(--dim);max-width:34em}
  #state p.err{color:#E8836B}
  #state a{
    display:inline-block;margin-top:6px;padding:9px 18px;border-radius:6px;
    border:1px solid rgba(250,246,240,.22);color:var(--text);font-size:13px;text-decoration:none;
  }
  footer{
    flex:0 0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)) 16px;
    font-size:11px;color:var(--dim);letter-spacing:.06em;
    border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;
  }
  footer b{color:var(--accent);font-weight:500}
</style>
</head>
<body>

<header>
  <i class="dot"></i>
  <h1 id="title">正在准备…</h1>
  <span>TVBOX-NY</span>
</header>

<div id="stage">
  <video id="v" playsinline webkit-playsinline x5-playsinline
         x5-video-player-type="h5" x5-video-player-fullscreen="false"
         controls preload="none" poster=""></video>
  <div id="state">
    <div class="spinner" id="spin"></div>
    <p id="msg">正在从电视取流…</p>
  </div>
</div>

<footer>
  <span>手机播放 · 同一 WiFi 下有效</span>
  <span id="host"></span>
</footer>

<script src="/hls.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);

  /* 参数 u 是 base64url 编码的原始播放地址（电视上那行「播放地址」） */
  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  var titleEl = document.getElementById('title');
  var msgEl   = document.getElementById('msg');
  var spinEl  = document.getElementById('spin');
  var stateEl = document.getElementById('state');
  var video   = document.getElementById('v');
  document.getElementById('host').textContent = location.host;

  var raw = q.get('u');
  var name = q.get('t');
  if (name) { titleEl.textContent = decodeURIComponent(name); document.title = decodeURIComponent(name); }

  if (!raw) {
    fail('二维码里没有播放地址，请在电视上重新点一次「手机播放」');
    return;
  }

  var url;
  try { url = b64urlDecode(raw); }
  catch (e) { fail('播放地址解析失败：' + e.message); return; }

  /*
   * 电视上那行地址是 http://127.0.0.1:9978/proxy?...，那是电视自己身上的本机代理。
   * 手机上不存在 127.0.0.1，必须换成当前访问的电视地址（就是 location.host）。
   * 换完之后，手机拉的每一个 m3u8/分片都会打到电视上，由电视带上正确的
   * UA / Referer 去源站取，再回传给手机 —— 防盗链由电视兜住。
   */
  url = url.replace(/https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?/gi, location.protocol + '//' + location.host);

  var isHls = /\.m3u8(\?|$)/i.test(url) || /[?&]do=m3u8/i.test(url) || /\.m3u8/i.test(url);

  function fail(text) {
    spinEl.style.display = 'none';
    msgEl.className = 'err';
    msgEl.innerHTML = text;
    stateEl.classList.remove('hide');
  }

  function ready() {
    stateEl.classList.add('hide');
  }

  video.addEventListener('playing', ready);
  video.addEventListener('error', function () {
    fail('手机这边播不了这条流。<br>' +
         '常见原因：该源的封装格式手机不支持，或这条流只允许电视播放。<br>' +
         '试试在电视上「切源」换一个源，再扫码。');
  });

  if (isHls) {
    if (video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('application/x-mpegURL')) {
      /* iOS Safari 原生吃 HLS，最省事也最省电 */
      video.src = url;
    } else if (window.Hls && window.Hls.isSupported()) {
      var hls = new window.Hls({
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        lowLatencyMode: false,
        manifestLoadingTimeOut: 12000,
        manifestLoadingMaxRetry: 2,
        fragLoadingMaxRetry: 3
      });
      hls.on(window.Hls.Events.ERROR, function (_, data) {
        if (!data || !data.fatal) return;
        if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) {
          fail('取流失败：' + (data.details || '网络错误') + '<br>' +
               '确认手机和电视在同一个 WiFi，且电视端 App 处于打开状态。<br>' +
               '<a href="' + location.href + '">重新加载</a>');
        } else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          fail('播放器出错：' + (data.details || '未知错误'));
        }
      });
      hls.loadSource(url);
      hls.attachMedia(video);
    } else {
      fail('这个浏览器不支持 HLS 播放，换 Chrome / Safari / 手机自带浏览器试试。');
    }
  } else {
    video.src = url;
  }

  /* 自动起播：多数浏览器允许静音自动播放，被拦截时用户点一下播放键即可 */
  video.muted = true;
  var p = video.play();
  if (p && p.catch) p.catch(function () { /* 等用户手动点 */ });
  video.addEventListener('volumechange', function () {
    if (!video.muted) ready();
  });
})();
</script>
</body>
</html>
