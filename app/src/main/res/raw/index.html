<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover">
	<meta name="wechat-enable-text-zoom-em" content="true">
	<title>TvBox-NY</title>
	<meta name="layoutmode" content="standard">
	<!-- PWA：加到手机主屏后按独立 App 打开，没有地址栏 -->
	<link rel="manifest" href="/manifest.webmanifest">
	<meta name="theme-color" content="#0B0A09">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="TvBox-NY">
	<link rel="apple-touch-icon" href="/icon-192.png">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="ui.css">
	<style>
		/* 遥控面板 v3：单屏实体遥控 —— 导航环 + 摇杆/大返回并排，竖向不滚动 */
		.rc {
			height: 100%;
			max-width: 400px;
			margin: 0 auto;
			padding: 10px 14px 12px;
			display: flex;
			flex-direction: column;
			justify-content: space-evenly;
			align-items: center;
			text-align: center;
			box-sizing: border-box;
			background: linear-gradient(180deg, #232327 0%, #161619 45%, #0e0e11 100%);
			border-left: 1px solid #2c2c33;
			border-right: 1px solid #2c2c33;
			overflow: hidden;
		}

		.rc__head {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex: 0 0 auto;
		}

		.rc__title {
			font-size: 13px;
			font-weight: 700;
			letter-spacing: .28em;
			color: #DFA35C;
		}

		.rc__speed {
			flex: 1;
			margin-left: 12px;
			text-align: right;
			font-size: 11px;
			letter-spacing: .06em;
			color: #B5ADA1;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* 圆形导航环：↑◀OK▶▼ */
		.rc__grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			grid-template-rows: repeat(3, 1fr);
			width: 208px;
			height: 208px;
			flex: 0 0 auto;
			border-radius: 50%;
			border: 1px solid rgba(255, 255, 255, .18);
			background:
				radial-gradient(circle at 50% 50%, transparent 52%, rgba(255, 255, 255, .05) 53%, rgba(255, 255, 255, .10) 82%, transparent 83%),
				radial-gradient(circle at 50% 38%, #26262c, #141417 72%);
			box-shadow: inset 0 2px 10px rgba(0, 0, 0, .6), 0 1px 0 rgba(255, 255, 255, .06);
		}

		.rc__key {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 50%;
			background: transparent;
			color: #F2EDE5;
			font-size: 26px;
			font-weight: 600;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
			-webkit-tap-highlight-color: transparent;
		}

		.rc__key:active,
		.rc__key.is-on {
			background: rgba(223, 163, 92, .30);
			color: #FFD9A6;
			box-shadow: 0 0 18px rgba(223, 163, 92, .35) inset;
		}

		.rc__key--ok {
			width: 76px;
			height: 76px;
			justify-self: center;
			align-self: center;
			background: radial-gradient(circle at 50% 34%, #FFC372, #DFA35C 62%, #B97F3C 100%);
			color: #241505;
			font-size: 15px;
			font-weight: 700;
			letter-spacing: .1em;
			box-shadow: 0 4px 16px rgba(223, 163, 92, .45), inset 0 1px 0 rgba(255, 255, 255, .5);
		}

		.rc__key--ok:active,
		.rc__key--ok.is-on {
			background: radial-gradient(circle at 50% 34%, #FFD9A6, #FFC372 62%, #DFA35C 100%);
			color: #241505;
		}

		/* 中段：摇杆 + 大返回 并排 */
		.rc__mid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 14px;
			width: 100%;
			justify-items: center;
			align-items: center;
			flex: 0 0 auto;
		}

		.rc__stick {
			position: relative;
			width: 104px;
			height: 104px;
			border-radius: 50%;
			border: 1px solid rgba(255, 255, 255, .16);
			background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
		}

		.rc__stick::after {
			content: '';
			position: absolute;
			left: 50%;
			top: 50%;
			width: 48px;
			height: 48px;
			margin: -24px 0 0 -24px;
			border-radius: 50%;
			border: 1px dashed rgba(255, 255, 255, .14);
			pointer-events: none;
		}

		.rc__ball {
			position: absolute;
			left: 50%;
			top: 50%;
			width: 44px;
			height: 44px;
			margin: -22px 0 0 -22px;
			border-radius: 50%;
			background: radial-gradient(circle at 50% 32%, #FFC372, #DFA35C 66%, #A96F33 100%);
			box-shadow: 0 3px 10px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .45);
			transition: transform .14s cubic-bezier(.22, .61, .36, 1);
			pointer-events: none;
		}

		.rc__stick.is-on .rc__ball {
			transition: none;
		}

		.rc__key--back {
			width: 104px;
			height: 104px;
			border-radius: 50%;
			background: linear-gradient(180deg, #2e2e34, #1d1d22);
			border: 2px solid #6b6b74;
			color: #F5F1EA;
			font-size: 26px;
			flex-direction: column;
			gap: 0;
			box-shadow: 0 3px 10px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .1);
		}

		.rc__key--back span {
			font-size: 13px;
			font-weight: 600;
			letter-spacing: .12em;
		}

		.rc__key--back:active,
		.rc__key--back.is-on {
			background: linear-gradient(180deg, #FFC372, #DFA35C);
			border-color: #FFC372;
			color: #241505;
		}

		.rc__label {
			font-size: 10px;
			letter-spacing: .24em;
			color: #8F887E;
			margin-top: 4px;
		}

		.rc__col {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
		}

		/* 功能键行：主页 / 菜单 / 播放 */
		.rc__row {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 10px;
			width: 100%;
			flex: 0 0 auto;
		}

		.rc__row .rc__key {
			height: 46px;
			border-radius: 23px;
			background: linear-gradient(180deg, #2e2e34, #1d1d22);
			border: 1px solid #46464f;
			color: #F5F1EA;
			font-size: 14px;
			font-weight: 600;
			box-shadow: 0 2px 6px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .09);
		}

		.rc__row .rc__key:active,
		.rc__row .rc__key.is-on {
			background: linear-gradient(180deg, #FFC372, #DFA35C);
			border-color: #FFC372;
			color: #241505;
		}

		.rc__mic {
			flex: 0 0 auto;
			margin-left: 8px;
			padding: 0 14px;
			height: 40px;
			border-radius: 6px;
			border: 1px solid rgba(250, 246, 240, .22);
			background: transparent;
			color: #FAF6F0;
			font-size: 15px;
		}

		.rc__mic.is-rec {
			color: #DFA35C;
			border-color: #DFA35C;
		}

		/* NOYA remote redesign: compact OLED controller, tuned for one-hand phone use. */
		#panel4 { padding: 0 !important; background: #111412; overflow-x: hidden; }
		#panel4 .rc {
			--rc-ink: #eef0e9; --rc-dim: #8f9990; --rc-line: rgba(236,240,231,.11);
			width: 100%; max-width: 480px; min-height: 100%; height: auto; margin: 0 auto;
			padding: max(12px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom));
			justify-content: flex-start; gap: 0; text-align: left; color: var(--rc-ink);
			background: radial-gradient(ellipse at 50% -12%,#354139 0,transparent 42%),linear-gradient(180deg,#161b17,#0e110f 72%);
			border: 0; overflow: hidden;
		}
		#panel4 .rc__head { height: 46px; flex: 0 0 46px; }
		#panel4 .rc__title { color:#e8ebe3; font:700 13px system-ui,sans-serif; letter-spacing:.23em; }
		#panel4 .rc__speed { margin-left:10px; color:#aeb8ae; font-size:10px; letter-spacing:.02em; }
		.rc__head-actions { display:flex; gap:7px; }
		.rc__icon { width:34px;height:34px;border:1px solid var(--rc-line);border-radius:50%;background:#ffffff08;color:#d5ddd4;display:grid;place-items:center;font-size:14px; }
		.rc__device { display:flex;align-items:center;gap:11px;margin-top:7px;padding:11px 13px;border:1px solid var(--rc-line);border-radius:15px;background:linear-gradient(135deg,#ffffff0c,#ffffff04); }
		.rc__tv-icon { width:38px;height:38px;border:1px solid #d4e2d52c;border-radius:12px;background:linear-gradient(145deg,#35473b,#202b24);display:grid;place-items:center;color:#dce8da;font-size:17px; }
		.rc__device-copy { min-width:0;flex:1; }
		.rc__device-name { font-size:13px;font-weight:600; }
		.rc__device-host { margin-top:3px;font:10px system-ui,sans-serif;color:var(--rc-dim); }
		.rc__online { display:flex;align-items:center;gap:6px;color:#c5d7c8;font-size:9px;white-space:nowrap; }
		.rc__online:before { content:'';width:6px;height:6px;border-radius:50%;background:#96c4a0;box-shadow:0 0 9px #96c4a0; }
		.rc__heading { display:flex;align-items:end;justify-content:space-between;margin:21px 1px 0; }
		.rc__overline { color:#89938a;font:9px system-ui,sans-serif;letter-spacing:.18em; }
		.rc__main-title { margin-top:3px;color:#eef0e9;font-size:23px;font-weight:600;letter-spacing:-.04em; }
		.rc__modes { display:flex;padding:3px;border:1px solid var(--rc-line);border-radius:30px;background:#ffffff08; }
		.rc__mode { height:29px;padding:0 12px;border:0;border-radius:22px;background:transparent;color:#9ba39b;font-size:10px; }
		.rc__mode.active { background:#d4dfd3;color:#202720;font-weight:600; }
		#panel4 .rc__grid {
			position:relative;width:min(76vw,310px);height:min(76vw,310px);margin:14px auto 0;padding:11%;gap:4px;
			border:1px solid rgba(224,237,221,.17);
			background:radial-gradient(circle at 50% 30%,#2b342e,#1a201c 64%,#141815);
			box-shadow:0 22px 65px #050706a8,inset 0 1px 0 #ffffff17,inset 0 -25px 40px #080a08a6;
		}
		#panel4 .rc__grid:before { content:'';position:absolute;inset:5%;border:1px solid #ffffff08;border-radius:50%;pointer-events:none; }
		#panel4 .rc__key { position:relative;z-index:1;color:#c3cbc1;font-size:24px;border-radius:20px;transition:background .12s,color .12s,transform .12s; }
		#panel4 .rc__key:active,#panel4 .rc__key.is-on { background:#c5d5c51a;color:#f3f6ef;box-shadow:none; }
		#panel4 .rc__key--ok { width:68px;height:68px;border-radius:50%;background:linear-gradient(145deg,#d9e3d5,#9eafa0);color:#1a211c;font-size:12px;box-shadow:0 4px 20px #bcd2bd35,inset 0 1px 0 #fff9; }
		#panel4 .rc__key--ok:active,#panel4 .rc__key--ok.is-on { background:#edf4e8;color:#161c17; }
		.rc__touch-plane { display:none;position:absolute;z-index:4;inset:9%;border-radius:50%;touch-action:none; }
		.rc__thumb { position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;border:1px solid #e3ecdf55;background:radial-gradient(circle at 35% 28%,#e5ecdf,#9eafa0 74%);box-shadow:0 6px 22px #05070699;opacity:0;transform:translate(0,0);pointer-events:none;transition:opacity .18s; }
		#panel4 .rc__grid.is-touch .rc__key { opacity:.16;pointer-events:none; }
		#panel4 .rc__grid.is-touch .rc__touch-plane { display:block; }
		#panel4 .rc__grid.is-touch .rc__thumb { opacity:1; }
		#panel4 .rc__mid { display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:15px; }
		#panel4 .rc__mid .rc__key { height:58px;border:1px solid var(--rc-line);border-radius:14px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);font-size:16px;color:#d5ded3;box-shadow:none; }
		#panel4 .rc__mid .rc__key span { font-size:9px;letter-spacing:.04em;color:#a0aaa0; }
		#panel4 .rc__mid .rc__key:active,#panel4 .rc__mid .rc__key.is-on { background:#c3d4c21b;border-color:#c3d4c24f;color:#eff5eb; }
		.rc__mid .rc__key--back { border:1px solid var(--rc-line)!important;border-radius:14px!important;background:linear-gradient(145deg,#ffffff0d,#ffffff04)!important; }
		.rc__voice { height:58px;border:1px solid var(--rc-line);border-radius:14px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);color:#d5ded3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px; }
		.rc__voice span { color:#a0aaa0;font-size:9px; }
		.rc__voice.is-rec { color:#e4c0a5;border-color:#e4c0a5;box-shadow:0 0 0 4px #e4c0a51c; }
		.rc__row { display:grid;grid-template-columns:1fr auto 1fr;gap:9px;width:100%;margin-top:10px; }
		.rc__utility { min-height:58px;padding:6px 9px;border:1px solid var(--rc-line);border-radius:14px;background:#ffffff06;display:flex;align-items:center;justify-content:space-around; }
		.rc__utility-label { color:#929c93;font-size:9px;writing-mode:vertical-rl; }
		#panel4 .rc__row .rc__key { width:32px;height:36px;border:0;border-radius:10px;background:#ffffff08;color:#dce2d8;font-size:16px;box-shadow:none; }
		.rc__utility-center { display:flex;flex-direction:column;align-items:center;gap:1px;color:#d9e0d7;font-size:13px; }
		.rc__utility-center small { color:#9ba49b;font-size:8px; }
		.rc__keyboard { width:55px;border:1px solid var(--rc-line);border-radius:14px;background:#ffffff08;color:#d5ded3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:16px; }
		.rc__keyboard span { color:#a4ada4;font-size:8px; }
		.rc__transport { display:flex;justify-content:center;gap:9px;margin:10px 0 13px; }
		.rc__transport .rc__key { height:37px;min-width:53px;width:auto;padding:0 10px;border:1px solid var(--rc-line);border-radius:12px;background:#ffffff06;color:#b9c1b8;font-size:12px; }
		.rc__transport .rc__key--play { min-width:118px;background:#d3dfd1;color:#1c241e;border-color:#d3dfd1;font-size:10px;font-weight:700; }
		#panel4 .rc__transport .rc__key:active,#panel4 .rc__transport .rc__key.is-on { background:#e5eee2;color:#182019; }
		body.remote-mode .weui-tabbar { background:rgba(18,22,19,.94);border-top:1px solid rgba(236,240,231,.09);backdrop-filter:blur(18px); }
		body.remote-mode .weui-tabbar:before { display:none; }
		@media(max-height:760px) {
			#panel4 .rc { padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom)); }
			#panel4 .rc__head { height:36px;flex-basis:36px; }
			#panel4 .rc__device { padding:7px 10px;margin-top:3px; }
			#panel4 .rc__tv-icon { width:32px;height:32px; }
			.rc__heading { margin-top:10px; }
			#panel4 .rc__grid { width:min(64vw,235px);height:min(64vw,235px);margin-top:7px; }
			#panel4 .rc__mid { margin-top:8px; }
			#panel4 .rc__mid .rc__key,.rc__voice { height:48px; }
			.rc__utility { min-height:48px; }
			.rc__transport { margin:7px 0 8px; }
		}
		/* Mobile browser viewport: keep the complete remote visible above the tab bar. */
		#panel4 { min-height:0; overflow:hidden !important; }
		#panel4 .rc {
			width:100%;height:100%;min-height:0;max-height:100%;
			padding:6px 18px max(7px,env(safe-area-inset-bottom));
			justify-content:space-between;gap:4px;overflow:hidden;
		}
		#panel4 .rc__head { height:32px;flex-basis:32px;min-height:32px; }
		#panel4 .rc__device { flex:0 0 auto;margin-top:0;padding:6px 10px;border-radius:13px; }
		#panel4 .rc__tv-icon { width:30px;height:30px;border-radius:9px; }
		#panel4 .rc__heading { flex:0 0 auto;margin:3px 1px 0; }
		#panel4 .rc__main-title { font-size:21px; }
		#panel4 .rc__grid { width:min(62vw,250px,31dvh);height:auto;aspect-ratio:1;flex:0 0 auto;margin:2px auto;padding:9%; }
		#panel4 .rc__key--ok { width:58px;height:58px; }
		#panel4 .rc__mid { grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:2px; }
		#panel4 .rc__mid>* { width:100%;min-width:0;box-sizing:border-box; }
		#panel4 .rc__mid .rc__key,#panel4 .rc__voice { height:48px;padding-left:2px;padding-right:2px;border-radius:12px; }
		#panel4 .rc__mid .rc__key { flex-direction:column;gap:1px; }
		#panel4 .rc__voice { gap:2px;font-size:14px; }
		#panel4 .rc__row { grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);gap:7px;margin-top:2px; }
		#panel4 .rc__utility { min-width:0;min-height:46px;padding:4px 5px;border-radius:12px; }
		#panel4 .rc__row .rc__key { width:28px;height:32px; }
		#panel4 .rc__keyboard { width:52px;min-height:46px;border-radius:12px; }
		#panel4 .rc__transport { flex:0 0 auto;margin:2px 0 0;gap:7px; }
		#panel4 .rc__transport .rc__key { height:36px;min-width:46px;padding:0 8px; }
		#panel4 .rc__transport .rc__key--play { min-width:0;width:min(42vw,170px); }
		@media(max-height:700px) {
			#panel4 .rc { padding-top:3px;padding-bottom:4px;gap:2px; }
			#panel4 .rc__head { height:27px;flex-basis:27px;min-height:27px; }
			#panel4 .rc__icon { width:28px;height:28px; }
			#panel4 .rc__device { padding:4px 8px; }
			#panel4 .rc__tv-icon { width:26px;height:26px; }
			#panel4 .rc__main-title { font-size:18px; }
			#panel4 .rc__mode { height:25px;padding:0 9px; }
			#panel4 .rc__grid { width:min(56vw,210px,28dvh); }
			#panel4 .rc__key--ok { width:50px;height:50px; }
			#panel4 .rc__mid .rc__key,#panel4 .rc__voice { height:42px;font-size:13px; }
			#panel4 .rc__utility { min-height:40px; }
			#panel4 .rc__row .rc__key { height:28px; }
			#panel4 .rc__keyboard { min-height:40px; }
			#panel4 .rc__transport .rc__key { height:32px; }
		}
		@media(max-width:360px) {
			#panel4 .rc { padding-left:12px;padding-right:12px; }
			#panel4 .rc__mid { gap:5px; }
			#panel4 .rc__row { grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);gap:5px; }
			#panel4 .rc__keyboard { width:46px; }
			#panel4 .rc__utility-label { display:none; }
		}
	</style>
</head>

<body>
	<div class="page">
		<div class="page__bd" style="height: 100%;">
			<div class="weui-tab">
				<div id="panel1" role="tabpanel" aria-labelledby="tab1" class="weui-tab__panel">
					<div class="weui-form">
						<div class="weui-form__text-area">
							<h2 class="weui-form__title">TVBox . 搜索</h2>
						</div>
						<div class="weui-form__control-area">
							<div class="weui-cells__group weui-cells__group_form">
								<div class="weui-cells">
									<div class="weui-cell weui-cell_active weui-cell_vcode weui-cell_wrap">
										<div class="weui-cell__bd weui-flex">
											<input id="search_key_word"
												class="weui-input weui-cell__control weui-cell__control_flex"
												type="text" value="" placeholder="请输入搜索的关键字..." />
											<button id="btn_voice" type="button" onclick="toggleVoice(); return false;"
												class="rc__mic" title="语音输入（Chrome / Edge 支持）">🎙</button>
											<button onclick="search(); return false;"
												class="weui-cell__control weui-btn weui-btn_default weui-vcode-btn">搜索</button>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div id="panel2" role="tabpanel" aria-labelledby="tab2" class="weui-tab__panel" style="display: none;">
					<div class="weui-form">
						<div class="weui-form__text-area">

			<div class="weui-dialog__ft">
				<a role="button" href="javascript:void(0)" onclick="doNewFolder(0)"
					class="weui-dialog__btn weui-dialog__btn_default">取消</a>
				<a role="button" href="javascript:void(0)" onclick="doNewFolder(1)"
					class="weui-dialog__btn weui-dialog__btn_primary">确定</a>
			</div>
		</div>
	</div>

	<div role="dialog" aria-hidden="true" aria-modal="true" id="delFolder" style="display: none;">
		<div class="weui-mask"></div>
		<div class="weui-dialog">
			<div class="weui-dialog__hd"><strong class="weui-dialog__title">删除文件夹</strong></div>
			<div class="weui-dialog__bd" id="delFolderContent"></div>
			<div class="weui-dialog__ft">
				<a role="button" href="javascript:void(0)" onclick="doDelFolder(0)"
					class="weui-dialog__btn weui-dialog__btn_default">取消</a>
				<a role="button" href="javascript:void(0)" onclick="doDelFolder(1)"
					class="weui-dialog__btn weui-dialog__btn_primary">确定</a>
			</div>
		</div>
	</div>

	<div role="dialog" aria-hidden="true" aria-modal="true" id="delFile" style="display: none;">
		<div class="weui-mask"></div>
		<div class="weui-dialog">
			<div class="weui-dialog__hd"><strong class="weui-dialog__title">删除文件</strong></div>
			<div class="weui-dialog__bd" id="delFileContent"></div>
			<div class="weui-dialog__ft">
				<a role="button" href="javascript:void(0)" onclick="doDelFile(0)"
					class="weui-dialog__btn weui-dialog__btn_default">取消</a>
				<a role="button" href="javascript:void(0)" onclick="doDelFile(1)"
					class="weui-dialog__btn weui-dialog__btn_primary">确定</a>
			</div>
		</div>
	</div>

	<div role="alert" id="warnToast" style="display: none;">
		<div class="weui-mask_transparent"></div>
		<div class="weui-toast">
			<i class="weui-icon-warn weui-icon_toast"></i>
			<p class="weui-toast__content" id="warnToastContent"></p>
		</div>
	</div>

	<div role="alert" id="loadingToast" style="display: none;">
		<div class="weui-mask_transparent"></div>
		<div class="weui-toast">
			<span class="weui-primary-loading weui-icon_toast">
				<span class="weui-primary-loading__dot"></span>
			</span>
			<p class="weui-toast__content">加载中</p>
		</div>
	</div>
	<script src="jquery.js"></script>
	<script src="script.js"></script>
</body>

</html>
