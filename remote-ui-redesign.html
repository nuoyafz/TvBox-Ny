<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111412"><title>NOYA 遥控器 · 交互概念</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{--bg:#111412;--panel:#1b201d;--glass:rgba(255,255,255,.055);--line:rgba(236,240,231,.11);--ink:#eef0e9;--muted:#8f9990;--accent:#bfd0c1;--accent2:#d9c1a6;--green:#9fbea8;--shadow:0 22px 65px #050706a8;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','DM Sans',sans-serif}body{min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden;background:radial-gradient(ellipse at 50% -12%,#354139 0,transparent 42%),linear-gradient(180deg,#161b17,#0e110f 72%)}button{font:inherit;color:inherit;border:0;cursor:pointer}.app{width:min(100%,480px);min-height:100dvh;padding:env(safe-area-inset-top,0px) 22px calc(20px + var(--safe));position:relative;display:flex;flex-direction:column;isolation:isolate}.app:before{content:"";position:fixed;z-index:-1;inset:0;opacity:.08;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E")}
.top{height:64px;display:flex;align-items:center;justify-content:space-between}.wordmark{font:700 13px 'DM Sans',sans-serif;letter-spacing:.23em;color:#e8ebe3}.top-actions{display:flex;gap:8px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--glass);display:grid;place-items:center;color:#cbd2c9;font-size:15px;backdrop-filter:blur(15px)}
.device{margin-top:10px;display:flex;align-items:center;gap:12px;padding:14px 15px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 12px 38px #0002;backdrop-filter:blur(22px)}.device-icon{width:42px;height:42px;border:1px solid #d4e2d52c;border-radius:13px;background:linear-gradient(145deg,#35473b,#202b24);display:grid;place-items:center;color:#dce8da;font-size:18px}.device-info{flex:1;min-width:0}.device-name{font-size:14px;font-weight:600;letter-spacing:.01em}.device-detail{margin-top:4px;font-size:10px;color:var(--muted);letter-spacing:.04em}.connected{display:flex;align-items:center;gap:6px;color:#c5d7c8;font-size:10px}.connected:before{content:"";width:6px;height:6px;background:#96c4a0;border-radius:50%;box-shadow:0 0 10px #96c4a0}
.mode-row{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 8px}.mode-title{font-size:24px;font-weight:600;letter-spacing:-.04em}.mode-caption{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#889189}.mode-tabs{height:40px;padding:3px;display:flex;border:1px solid var(--line);border-radius:99px;background:#ffffff08}.mode-tabs button{padding:0 15px;border-radius:99px;background:transparent;color:#9ba39b;font-size:11px}.mode-tabs button.active{background:#d4dfd3;color:#202720;font-weight:600}
.pad-wrap{position:relative;margin:21px auto 0;width:min(82vw,350px);aspect-ratio:1;display:grid;place-items:center}.halo{position:absolute;inset:-4%;border-radius:50%;border:1px solid rgba(219,231,215,.06);box-shadow:0 0 60px rgba(160,190,166,.055),inset 0 0 40px #c9dfca08}.halo:before,.halo:after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(219,231,215,.06)}.halo:after{inset:20%;border-style:dashed;opacity:.5}.pad{position:relative;width:88%;height:88%;border-radius:50%;padding:8%;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:5px;background:radial-gradient(circle at 50% 30%,#2b342e,#1a201c 64%,#141815);border:1px solid rgba(224,237,221,.17);box-shadow:var(--shadow),inset 0 1px 0 #ffffff17,inset 0 -25px 40px #080a08a6;touch-action:none;user-select:none}.pad:before{content:"";position:absolute;inset:4px;border:1px solid #ffffff08;border-radius:50%;pointer-events:none}.dir{position:relative;z-index:1;border-radius:24px;background:transparent;color:#c3cbc1;display:grid;place-items:center;font-size:25px;transition:background .12s,color .12s,transform .12s}.dir:active,.dir.pressed{background:#c5d5c51a;color:#eff5eb;transform:scale(.93)}.dir.up{grid-column:2;grid-row:1}.dir.left{grid-column:1;grid-row:2}.dir.ok{grid-column:2;grid-row:2;border-radius:50%;background:linear-gradient(145deg,#d9e3d5,#9eafa0);color:#1a211c;font-size:12px;font-weight:700;letter-spacing:.1em;box-shadow:0 4px 20px #bcd2bd35,inset 0 1px 0 #fff9}.dir.ok:active{background:#edf4e8;transform:scale(.92)}.dir.right{grid-column:3;grid-row:2}.dir.down{grid-column:2;grid-row:3}.center-hint{position:absolute;bottom:7%;font-size:8px;letter-spacing:.17em;color:#7c877e}
.shortcut-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 1px 0}.shortcut{height:65px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.15s}.shortcut:active,.shortcut.on{background:#c3d4c21b;border-color:#c3d4c24f;transform:scale(.97)}.shortcut .ico{font-size:16px;color:#d5ded3}.shortcut small{font-size:9px;color:#a0aaa0;letter-spacing:.05em}
.utility{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:12px;align-items:stretch}.util-card{border:1px solid var(--line);border-radius:16px;background:#ffffff06;min-height:67px;display:flex;align-items:center;justify-content:space-around;padding:8px 11px}.util-name{font-size:9px;letter-spacing:.12em;color:#8f9990;writing-mode:vertical-rl}.step{width:34px;height:38px;border-radius:11px;background:#ffffff08;color:#dce2d8;font-size:17px}.step:active{background:#c3d4c230}.volume-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#d9e0d7;font-size:9px}.vol-icon{font-size:14px}.center-tool{width:68px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.center-tool span:first-child{font-size:17px}.center-tool small{font-size:9px;color:#a4ada4}
.transport{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}.transport button{height:40px;min-width:57px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:#ffffff06;color:#b9c1b8;font-size:14px}.transport .playpause{min-width:86px;background:#d3dfd1;color:#1c241e;font-size:12px;font-weight:600;border-color:#d3dfd1}.transport button:active{transform:scale(.95)}.bottom-nav{margin-top:auto;padding-top:18px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #ffffff0e}.bottom-nav button{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;color:#737e75;font-size:9px}.bottom-nav button span{font-size:16px}.bottom-nav button.active{color:#d5e1d3}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe));z-index:8;transform:translate(-50%,12px);padding:10px 15px;border:1px solid #ffffff1c;border-radius:99px;background:#242b26e8;color:#e2e8df;font-size:11px;white-space:nowrap;opacity:0;transition:.2s;pointer-events:none;backdrop-filter:blur(18px)}.toast.show{opacity:1;transform:translate(-50%,0)}.sheet{position:fixed;z-index:7;left:50%;bottom:calc(70px + var(--safe));width:min(calc(100% - 36px),440px);padding:18px;border:1px solid #ffffff24;border-radius:22px;background:#202621ed;box-shadow:0 20px 70px #0009;backdrop-filter:blur(26px);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.22s}.sheet.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.sheet h3{margin:0 0 13px;font-size:14px}.sheet input{width:100%;height:46px;padding:0 14px;border:1px solid #ffffff20;border-radius:12px;background:#0f1310;color:#edf0e9;font:inherit;font-size:13px;outline:none}.sheet input:focus{border-color:#c6d6c7}.sheet .send{margin-top:10px;width:100%;height:42px;border-radius:12px;background:#d0ddce;color:#1a221c;font-weight:600}.mic.listening{color:#e4c0a5;border-color:#e4c0a5;box-shadow:0 0 0 4px #e4c0a51c}
@media(max-height:760px){.app{padding-top:0}.top{height:48px}.device{margin-top:2px;padding:9px 12px}.device-icon{width:36px;height:36px}.mode-row{margin-top:13px}.pad-wrap{width:min(64vw,265px);margin-top:6px}.shortcut-row{margin-top:9px}.shortcut{height:54px}.utility{margin-top:8px}.util-card{min-height:56px}.transport{margin-top:9px}.bottom-nav{padding-top:8px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="wordmark">NOYA <span style="font-weight:400;letter-spacing:.08em;color:#849087">REMOTE</span></div><div class="top-actions"><button class="icon-btn" id="vibrate" aria-label="震动反馈">⌁</button><button class="icon-btn" id="more" aria-label="更多">···</button></div></header>
  <section class="device"><div class="device-icon">▣</div><div class="device-info"><div class="device-name">客厅电视</div><div class="device-detail">TVBox · 192.168.1.18</div></div><div class="connected">已连接</div></section>
  <div class="mode-row"><div><div class="mode-caption">REMOTE CONTROL</div><div class="mode-title">遥控器</div></div><div class="mode-tabs"><button class="active" data-mode="遥控">遥控</button><button data-mode="触控">触控</button></div></div>
  <section class="pad-wrap" id="padWrap"><div class="halo"></div><div class="pad" id="pad">
    <button class="dir up" data-key="19" aria-label="上">⌃</button><button class="dir left" data-key="21" aria-label="左">‹</button><button class="dir ok" data-key="23" aria-label="确认">确定</button><button class="dir right" data-key="22" aria-label="右">›</button><button class="dir down" data-key="20" aria-label="下">⌄</button><div class="center-hint">SWIPE OR TAP</div>
  </div></section>
  <section class="shortcut-row"><button class="shortcut" data-key="4"><span class="ico">↶</span><small>返回</small></button><button class="shortcut" data-key="3"><span class="ico">⌂</span><small>主页</small></button><button class="shortcut" data-key="82"><span class="ico">☷</span><small>菜单</small></button><button class="shortcut" id="voice"><span class="ico">♩</span><small>语音搜片</small></button></section>
  <section class="utility"><div class="util-card"><span class="util-name">音量</span><button class="step" data-key="25">−</button><div class="volume-mid"><span class="vol-icon">◖</span><span>音量</span></div><button class="step" data-key="24">＋</button></div><button class="center-tool" id="keyboard"><span>⌨</span><small>键盘</small></button><div class="util-card"><span class="util-name">频道</span><button class="step" data-key="166">−</button><div class="volume-mid"><span class="vol-icon">▤</span><span>频道</span></div><button class="step" data-key="167">＋</button></div></section>
  <section class="transport"><button data-key="89" aria-label="上一段">|◀</button><button class="playpause" data-key="85">▶　播放 / 暂停</button><button data-key="90" aria-label="下一段">▶|</button></section>
  <nav class="bottom-nav"><button class="active"><span>◉</span>遥控</button><button id="devices"><span>▣</span>设备</button><button id="history"><span>◷</span>操作记录</button></nav>
</main>
<div class="toast" id="toast">发送成功</div>
<div class="sheet" id="keyboardSheet"><h3>输入到电视</h3><input id="textInput" placeholder="输入片名、网址或文字" autocomplete="off"><button class="send" id="sendText">发送到电视</button></div>
<div class="sheet" id="deviceSheet"><h3>连接设备</h3><input value="客厅电视 · 已连接" readonly><button class="send" id="closeSheet">完成</button></div>
<script>
const toast=document.getElementById('toast');let toastTimer,pressTimer;
function notify(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1450)}
function sendKey(button){button.classList.add('pressed');clearTimeout(pressTimer);pressTimer=setTimeout(()=>button.classList.remove('pressed'),170);notify((button.getAttribute('aria-label')||button.textContent.trim())+' · 已发送')}
document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();sendKey(b)})});
let activePointer=null,currentSwipe='';const pad=document.getElementById('pad');
pad.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;activePointer=e.pointerId;pad.setPointerCapture(e.pointerId);movePad(e)});
pad.addEventListener('pointermove',e=>{if(activePointer===e.pointerId)movePad(e)});
pad.addEventListener('pointerup',e=>{if(activePointer!==e.pointerId)return;activePointer=null;pad.querySelectorAll('.dir').forEach(x=>x.classList.remove('pressed'));if(currentSwipe)notify('触控 · '+currentSwipe+' 已发送');currentSwipe=''});
function movePad(e){const r=pad.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width*.35),dy=(e.clientY-r.top-r.height/2)/(r.height*.35);let dir=Math.abs(dx)<.34&&Math.abs(dy)<.34?'确定':Math.abs(dx)>Math.abs(dy)?(dx>0?'向右':'向左'):(dy>0?'向下':'向上');currentSwipe=dir;pad.querySelectorAll('.dir').forEach(x=>x.classList.toggle('pressed',x.getAttribute('aria-label')===dir||x.textContent.trim()===dir));}
document.querySelectorAll('.mode-tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mode-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');pad.classList.toggle('touch-mode',b.dataset.mode==='触控');notify(b.dataset.mode==='触控'?'触控模式：滑动方向盘发送方向':'遥控模式：点击方向键操作')}));
document.getElementById('voice').addEventListener('click',e=>{let b=e.currentTarget;b.classList.toggle('listening');notify(b.classList.contains('listening')?'正在聆听，请说出片名':'语音输入已结束')});
const ks=document.getElementById('keyboardSheet'),ds=document.getElementById('deviceSheet');document.getElementById('keyboard').onclick=()=>ks.classList.toggle('show');document.getElementById('sendText').onclick=()=>{ks.classList.remove('show');notify('文字已发送到电视')};document.getElementById('devices').onclick=()=>ds.classList.add('show');document.getElementById('closeSheet').onclick=()=>ds.classList.remove('show');document.getElementById('more').onclick=()=>notify('长按返回键可断开连接');document.getElementById('vibrate').onclick=()=>{if(navigator.vibrate)navigator.vibrate(25);notify('轻触反馈已开启')};document.getElementById('history').onclick=()=>notify('最近操作：播放 / 暂停');
</script>
</body>
</html>
